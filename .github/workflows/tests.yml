name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  fix-style:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git User Configuration
        uses: Homebrew/actions/git-user-config@main

      - name: Auto-fix Homebrew style issues
  env:
    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  run: |
    # Ensure repo is checked out and safe
    git config --global --add safe.directory "$GITHUB_WORKSPACE"

    if [ -d "Casks" ]; then brew style --fix Casks/; fi
    if [ -d "Formula" ]; then brew style --fix Formula/; fi

    if [ -n "$(git status --porcelain)" ]; then
      git add .
      git commit -m "Auto-fix Homebrew styling issues"

      # Authenticate and push
      git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
      git push origin HEAD:main
    else
      echo "No style issues found or files already clean!"
    fi

  test-bot:
    needs: fix-style
    strategy:
      matrix:
        os: [ ubuntu-24.04, macos-15-intel, macos-26 ]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
