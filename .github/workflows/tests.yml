name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ ubuntu-24.04, macos-15-intel, macos-26 ]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: write       
      pull-requests: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git User Configuration
        uses: Homebrew/actions/git-user-config@main

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}   # <--- FIXED TYPO HERE
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Auto-fix Homebrew style issues
        if: matrix.os == 'ubuntu-24.04'
        run: |
          brew style --fix masterofdeath01/apps
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Auto-fix Homebrew styling issues"
          fi

      - name: Push Auto-fixes Natively
        if: matrix.os == 'ubuntu-24.04'
        uses: Homebrew/actions/git-try-push@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: main

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
